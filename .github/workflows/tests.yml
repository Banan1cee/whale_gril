name: tests

# 只跑测试与编译，不需要任何密钥、微信或网络：
# 所有联网、发消息、看图、API Key 相关用例在 tests/ 里都是 mock 的。
on:
  push:
    branches: [main, feature4]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # 统一 UTF-8：CI 机器是英文区域（cp1252），中文断言消息和文件读写都靠这个。
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: 测试 / 分层 / 编译
    # 必须是 Windows：启动器是 WPF net10.0-windows，桥接是 Windows 语义的 Python。
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 不能低于 22：npm test 里的 node --test "tests/*.test.js" 的 glob 要 21+ 才会展开。
      # 也不能开 setup-node 的 cache：项目零依赖，没有 lock 文件。
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 启动器要 .NET 10 SDK：镜像自带的版本不保证，钉住一条线。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 环境版本
        shell: pwsh
        run: |
          node -v
          python -c "import sys, locale; print(sys.version); print('stdout=', sys.stdout.encoding, 'preferred=', locale.getpreferredencoding())"
          dotnet --version

      # workflow 文件本身也要过一遍静态检查：input 名写错、表达式语法错、引用不存在的
      # action 输入，GitHub 大多只给一条黄警告，甚至静默忽略（upload-artifact v4 的
      # archive 就是被忽略的），不拦下来等于没发现。放最前面，几十秒就能出结果。
      - name: workflow 静态检查（actionlint）
        if: always()
        shell: pwsh
        run: |
          $ver = '1.7.12'
          $zip = Join-Path $env:RUNNER_TEMP "actionlint-$ver.zip"
          $dir = Join-Path $env:RUNNER_TEMP "actionlint-$ver"
          Invoke-WebRequest -Uri "https://github.com/rhysd/actionlint/releases/download/v$ver/actionlint_${ver}_windows_amd64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          # SignPath 那两步还在用 upload-artifact v3 时代的 archive 输入（v4 已经没有），
          # 签名路径当前没启用，先只忽略这一条；其它问题一律不许过。
          & (Join-Path $dir 'actionlint.exe') -ignore 'input "archive" is not defined' `
            .github/workflows/build.yml .github/workflows/installer.yml .github/workflows/tests.yml
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::error title=actionlint::workflow 文件有静态错误，见上方输出'
            exit 1
          }

      # 后面每一步都加 if: always()，任何一步红了也把剩下的跑完，
      # 这样一次运行就能看到整条流水线的真实状态，而不是在第一个错处停下。
      - name: 分层依赖（谁可以 require 谁）
        if: always()
        run: node scripts/check-layers.js

      # 必须排在 dotnet build 之前：编译会让 launcher/obj 出现记录本机路径的文本文件，
      # 自检会把它当成「泄露个人信息」误报。
      - name: 发布自检
        if: always()
        shell: pwsh
        # 失败项也打成注解，不用登录也能看到是哪一条没过。
        run: |
          node scripts/release-check.js *> release-check.log
          $code = $LASTEXITCODE
          Get-Content release-check.log
          if ($code -ne 0) {
            $text = Get-Content -Raw -Encoding utf8 release-check.log
            $bad = ($text -split "`n") | Where-Object { $_ -match '✗' -or $_ -match '^\s+- ' } | Select-Object -First 20
            $msg = ((($bad -join "`n")) -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            if (-not $msg) { $msg = 'release-check failed' }
            Write-Output "::error title=release-check::$msg"
            exit $code
          }

      # release-check 里已经包含同一套规则；单独再跑一次是为了名字明确——
      # 失败时一眼能看出是隐私扫描挂了，而不是别的问题。
      # 只扫工作树，历史里的旧提交不在这里的覆盖范围内。
      - name: 隐私扫描（文本 + 二进制）
        if: always()
        run: node scripts/privacy-scan.js .

      - name: Node 单元测试（不需要装任何依赖）
        if: always()
        shell: pwsh
        # 注意：pwsh 不会展开引号里的通配符，所以走 npm test（内部是
        # node --test "tests/*.test.js"，由 Node 自己展开），和本地执行完全一致。
        # 失败时把失败行打成注解，方便没有仓库权限时定位。
        run: |
          npm test *> node-tests.log
          $code = $LASTEXITCODE
          Get-Content node-tests.log
          if ($code -ne 0) {
            $bad = (Get-Content -Encoding utf8 node-tests.log) |
              Select-String -Pattern 'not ok|✖|AssertionError|Error:|ℹ fail' |
              Select-Object -First 40
            $msg = (@($bad | ForEach-Object { $_.Line }) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            if (-not $msg) { $msg = 'node tests failed' }
            Write-Output "::error title=node-tests::$msg"
            exit $code
          }

      # 图片 / 表情包回归要真解码：Pillow 解图与抽帧、cryptography 试 AES 回源解密、
      # requests 被 bridge/engine.py 导入。这三个随包 runtime 里本来就有，CI 不装就等于
      # 把「真实解码路径」整组跳过（test_received_media.py 会 skip），等于没守。
      - name: Python 依赖（看图 / 表情包回归）
        if: always()
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet pillow cryptography requests

      - name: Python 单元测试
        if: always()
        shell: pwsh
        # 输出存下来，失败时把整段失败块转义进一条 ::error 注解，
        # 没有仓库权限也能从 check run 的 annotations 里看到完整 traceback。
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v *> py-tests.log
          $code = $LASTEXITCODE
          Get-Content py-tests.log
          if ($code -ne 0) {
            $text = Get-Content -Raw -Encoding utf8 py-tests.log
            $idx = $text.IndexOf('=====================')
            $tail = if ($idx -ge 0) { $text.Substring($idx) } else { $text }
            if ($tail.Length -gt 3800) { $tail = $tail.Substring(0, 3800) }
            $msg = $tail -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Output "::error title=python-failures::$msg"
            exit $code
          }

      # 这两个自检是纯逻辑的（不连微信、不要密钥），3.56/3.57 里就是拿它们
      # 验证「零焦点发送」和「按会话串行、跨会话并发」的，但一直只在开发机上手动跑。
      # 不进 CI 的后果是：谁动了 bridge/ 的编码或调度，只有真机才会发现。
      - name: 桥接自检（零焦点发送 / 消息调度）
        if: always()
        shell: pwsh
        run: |
          $failed = @()
          foreach ($script in @('scripts/bg-selftest.py', 'scripts/bridge-pipeline-selftest.py')) {
            Write-Output "===== $script ====="
            python $script *> selftest.log
            $code = $LASTEXITCODE
            Get-Content selftest.log
            if ($code -ne 0) {
              $text = Get-Content -Raw -Encoding utf8 selftest.log
              if ($text.Length -gt 3000) { $text = $text.Substring(0, 3000) }
              $msg = $text -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
              Write-Output "::error title=$script::$msg"
              $failed += $script
            }
          }
          if ($failed.Count -gt 0) { exit 1 }

      - name: 启动器编译
        if: always()
        run: dotnet build launcher/WhaleLauncher.csproj -c Release --nologo

      - name: 语音实验开关与发送回归（模拟接口，不发消息）
        if: always()
        timeout-minutes: 3
        run: dotnet run --project tests/voice-send/VoiceSendChecks.csproj -c Release

      - name: 启动器进程生命周期回归（模拟桥接）
        if: always()
        shell: pwsh
        run: ./scripts/test-launcher.ps1

      - name: 启动冒烟（--doctor）
        if: always()
        run: node server.js --doctor
